name: Build and Deploy

# Pushes to main build the Docker image, push it to GHCR and start it on the Hetzner server
# (~/stacks/devinpearson-me). See deploy/README.md.
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of racing the older one.
concurrency:
  group: deploy-devinpearson-me
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/devinpearson-me
  STACK_DIR: stacks/devinpearson-me

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_SITE_URL is compiled in at build time, so it's a repository variable.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://devinpearson.me' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: bash scripts/docker-smoke-test.sh "${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}"

      - name: Push image
        run: |
          docker push "${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}"
          docker push "${{ env.IMAGE_NAME }}:latest"

      - name: Create stack directory on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: mkdir -p "$HOME/${{ env.STACK_DIR }}"

      - name: Copy stack file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: deploy/compose.yml
          target: ${{ env.STACK_DIR }}
          strip_components: 1

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          APP_PORT: ${{ vars.APP_PORT || '8093' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_TOKEN,GHCR_USER,APP_PORT
          command_timeout: 10m
          script: |
            set -eu
            cd "$HOME/${{ env.STACK_DIR }}"

            PREVIOUS_TAG=$(sed -n 's/^IMAGE_TAG=//p' .env 2>/dev/null || true)
            write_env() { printf 'IMAGE_TAG=%s\nAPP_PORT=%s\n' "$1" "$APP_PORT" > .env; }

            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            write_env "$IMAGE_TAG"
            docker compose pull

            if docker compose up -d --remove-orphans --wait --wait-timeout 120; then
              docker image prune -f >/dev/null
              echo "Deployed $IMAGE_TAG"
              exit 0
            fi

            echo "The new release did not become healthy." >&2
            docker compose logs --tail 80 web >&2 || true
            if [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "$IMAGE_TAG" ]; then
              echo "Rolling back to $PREVIOUS_TAG" >&2
              write_env "$PREVIOUS_TAG"
              docker compose up -d --remove-orphans --wait --wait-timeout 120 || true
            fi
            exit 1
